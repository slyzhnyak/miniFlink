# CI workflow для miniFlink — сборка + тесты на OCaml 4.14 и 5.2.
# ЛЕЖИТ В docs/ci/, А НЕ в .github/workflows/, потому что токен
# автоматизации не имеет workflow-scope и не может пушить туда.
# Чтобы включить CI: скопируй этот файл в .github/workflows/ci.yml
# вручную (через GitHub UI или пуш с токеном, имеющим workflow scope).
name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  build-test:
    strategy:
      matrix:
        ocaml: ["4.14", "5.2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "${{ matrix.ocaml }}" }
      - run: sudo apt-get update && sudo apt-get install -y librocksdb-dev
      - run: opam install -y dune yojson ppx_deriving ppx_deriving_yojson qcheck-core qcheck
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      # Покрытие тестами (только на 4.14, чтобы не дублировать матрицу).
      # bisect_ppx ставится через opam в CI (в отличие от локального
      # окружения без opam — см. docs/coverage.md).
      - name: Coverage (4.14 only)
        if: matrix.ocaml == '4.14'
        run: |
          opam install -y bisect_ppx
          opam exec -- dune runtest --instrument-with bisect_ppx --force
          opam exec -- bisect-ppx-report summary

  # ── Интеграция Kafka EOS против ЖИВОГО брокера ──────────────
  # Поднимает реальный Kafka (KRaft, без Zookeeper) сервис-контейнером,
  # ставит librdkafka, собирает прод-биндинг (kafka_rdkafka + C-стабы) и
  # гоняет test_kafka_integration — проверка настоящих транзакций
  # (init/begin/commit/abort) и видимости read_committed сквозь брокер.
  # Это закрывает то, что фейк проверить не может.
  kafka-eos:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "5.2" }
      - name: Install librdkafka + rocksdb
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev librocksdb-dev
      - run: opam install -y dune yojson ppx_deriving ppx_deriving_yojson qcheck-core qcheck
      - name: Enable rdkafka subdir (remove the default-build exclusion)
        run: sed -i 's/ \\ rdkafka//' connectors/kafka/dune
      - name: Build prod binding + integration test
        run: opam exec -- dune build connectors/kafka/rdkafka/
      - name: Wait for Kafka to be ready
        run: |
          for i in $(seq 1 30); do
            if bash -c 'cat < /dev/null > /dev/tcp/localhost/9092' 2>/dev/null; then
              echo "Kafka TCP is up"
              # порт открыт ≠ координатор транзакций прогружен. Даём
              # брокеру время поднять transaction coordinator, иначе
              # init_transactions ловит "Coordinator load in progress".
              # init_transactions к тому же ретраится в коде, это вторая
              # линия защиты от флака на старте.
              sleep 8
              echo "Kafka should be ready"; exit 0
            fi
            echo "waiting for kafka ($i)..."; sleep 2
          done
          echo "Kafka did not become ready"; exit 1
      - name: Run EOS integration test against live broker
        env:
          KAFKA_BROKERS: localhost:9092
        run: |
          set -o pipefail
          if ! opam exec -- dune exec connectors/kafka/rdkafka/test_kafka_integration.exe 2>&1 | tee /tmp/eos_out.txt; then
            echo "===== EOS TEST OUTPUT (tail) ====="
            tail -40 /tmp/eos_out.txt
            echo "===== END ====="
            # одной аннотацией, чтобы не упереться в лимит построчных ::error::
            { echo "EOS integration failed. Tail of output:"; tail -25 /tmp/eos_out.txt; } > /tmp/eos_tail.txt
            awk 'BEGIN{printf "::error title=EOS failure::"} {gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0} END{print ""}' /tmp/eos_tail.txt
            exit 1
          fi

  # ── ThreadSanitizer: гонки в параллельном exactly-once ──────
  # TSan требует, чтобы инструментация была ВШИТА в компилятор switch
  # (ocaml-option-tsan) — это пересборка компилятора (~10-20 мин),
  # поэтому просим setup-ocaml собрать вариант +options СРАЗУ с опцией,
  # а не доставлять её поверх готового switch (доустановка поверх не
  # переинструментирует компилятор — job проходил бы ЛОЖНО зелёным).
  # На tsan-switch любая сборка инструментирована; GC OCaml даёт
  # TSan-предупреждения (minor_gc.c) — не наш код, поэтому deps+build
  # идут с мягкими TSAN_OPTIONS, а тест ЗАПУСКАЕТСЯ строго.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libunwind (нужен tsan-компилятору)
        run: sudo apt-get update && sudo apt-get install -y libunwind-dev librocksdb-dev
      - uses: ocaml/setup-ocaml@v3
        with:
          # вариант +options с tsan-опцией — компилятор соберётся
          # инструментированным. Это и есть длинный шаг (~10-20 мин).
          ocaml-compiler: "ocaml-variants.5.2.0+options,ocaml-option-tsan"
      - name: Verify the compiler is actually TSan-instrumented
        run: |
          # Доказываем инструментацию ДО тестов, иначе job бессмысленен.
          # Проверка 1: пакет-опция установлен в switch.
          HAS_OPT=0
          if opam list --installed 2>/dev/null | grep -qi ocaml-option-tsan; then
            HAS_OPT=1
            echo "ocaml-option-tsan installed in switch: yes"
          fi
          # Проверка 2: собрать НЕтривиальную программу (с доступами к
          # памяти — ссылка+мутация+массив) и поискать __tsan символы.
          # Пустая программа не годится: без доступов к памяти
          # инструментация не вставляет __tsan_read/write.
          cat > /tmp/probe.ml <<'ML'
          let () =
            let r = ref 0 in
            let a = Array.make 8 0 in
            for i = 0 to 7 do a.(i) <- !r + i; r := a.(i) done;
            Printf.printf "%d\n" !r
          ML
          HAS_SYM=0
          if opam exec -- ocamlfind ocamlopt -package str -linkpkg /tmp/probe.ml -o /tmp/probe 2>/dev/null \
             || opam exec -- ocamlopt /tmp/probe.ml -o /tmp/probe 2>/dev/null; then
            if nm /tmp/probe 2>/dev/null | grep -q "__tsan"; then
              HAS_SYM=1
              echo "TSan symbols present in compiled binary: yes"
            fi
          fi
          if [ "$HAS_OPT" = 1 ] || [ "$HAS_SYM" = 1 ]; then
            echo "TSan instrumentation confirmed (opt=$HAS_OPT sym=$HAS_SYM)"
          else
            echo "::error title=TSan not instrumented::switch compiler is NOT tsan-instrumented (opt=$HAS_OPT sym=$HAS_SYM) — job invalid"
            echo "--- opam list (tail) ---"; opam list --installed 2>/dev/null | grep -i ocaml || true
            exit 1
          fi
      - name: Install deps (мягкие TSAN_OPTIONS — не падать на GC-гонках рантайма)
        env:
          TSAN_OPTIONS: "halt_on_error=0 exitcode=0 report_bugs=0"
        run: opam install -y dune yojson ppx_deriving ppx_deriving_yojson qcheck-core qcheck
      - name: Build tsan test (мягкие TSAN_OPTIONS)
        env:
          TSAN_OPTIONS: "halt_on_error=0 exitcode=0 report_bugs=0"
        run: opam exec -- dune build test/tsan_parallel.exe
      - name: Run under TSan (строго — гонка в exactly-once завалит job)
        env:
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: |
          set -o pipefail
          if ! opam exec -- dune exec test/tsan_parallel.exe 2>&1 | tee /tmp/tsan_out.txt; then
            echo "===== TSAN OUTPUT (tail) ====="
            tail -40 /tmp/tsan_out.txt
            { echo "TSan reported a data race:"; grep -A15 "WARNING: ThreadSanitizer" /tmp/tsan_out.txt | head -20; } > /tmp/tsan_tail.txt
            awk 'BEGIN{printf "::error title=TSan data race::"} {gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0} END{print ""}' /tmp/tsan_tail.txt
            exit 1
          fi
